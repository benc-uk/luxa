name: Deploy web-viewer to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "web-viewer/**"
      - "luxa/**"
      - ".github/workflows/deploy-web-viewer.yml"
  workflow_dispatch:

# Allow the GITHUB_TOKEN to deploy to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one concurrent deployment; cancel in-progress runs on new pushes.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-viewer
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: web-viewer

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build wasm (release)
        run: wasm-pack build --target web --release

      - name: Bundle with Vite
        # base must match the GitHub Pages sub-path for this project site:
        # https://benc-uk.github.io/luxa/
        run: npx --yes vite build --base=/luxa/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web-viewer/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
