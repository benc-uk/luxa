<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#090a0b" />
    <title>WGPU Cube Example</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "IBM Plex Mono", "Cascadia Code", monospace;
        background: #090a0b;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #232629;
      }

      canvas {
        display: block;
        margin: 0 auto;
        outline: none;
        margin-top: 1vh;
        /* These override winit force injecting CSS style with width & height */
        width: 100% !important;
        height: 100% !important;
      }

      #error {
        position: fixed;
        top: 16px;
        left: 50%;
        z-index: 1;
        width: min(680px, calc(100vw - 32px));
        margin: 0;
        padding: 12px 16px;
        border: 1px solid #df6b57;
        border-radius: 4px;
        color: #fff6f2;
        background: #3c1512;
        font-size: 13px;
        line-height: 1.5;
        transform: translateX(-50%);
        visibility: hidden;
      }

      #error[data-visible="true"] {
        visibility: visible;
      }
    </style>
  </head>
  <body>
    <canvas id="cube-canvas" aria-label="Rotating texture-mapped cube"></canvas>
    <p id="error" role="alert"></p>

    <script type="module">
      import init from "./pkg/cube.js";

      init().catch((error) => {
        console.error(error);
        const errorElement = document.querySelector("#error");
        errorElement.textContent = `Unable to start the WebAssembly application: ${error}`;
        errorElement.dataset.visible = "true";
      });
    </script>
  </body>
</html>
