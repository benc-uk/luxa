<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />

    <title>Luxa: WASM Demo</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #112;
      }

      canvas {
        display: block;
        background: #000;
        /* Stop the browser turning touch drags/pinches on the canvas into
           page scroll or zoom, so our pointer handlers get the raw gestures. */
        touch-action: none;
        /* Canvas is square (1:1), so fit to whichever window dimension is
           smaller. This gives 100% height in landscape and 100% width in
           portrait, always covering as much as possible without clipping. */
        width: min(100vw, 100vh);
        height: min(100vw, 100vh);
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
      }

      select {
        font-size: 1.2rem;
        padding: 0.2rem 0.4rem;
        background: #222;
        color: #c5c5c5;
        border-radius: 0.4rem;
        padding: 0.4rem;
        position: absolute;
        top: 10px;
        left: 10px;
        z-index: 1000;
      }

      #bg-select {
        left: auto;
        right: 10px;
      }

      #message {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 1.5rem;
        color: #fff;
        font-family: sans-serif;
        text-shadow:
          -2px -2px 0 #000,
          2px -2px 0 #000,
          -2px 2px 0 #000,
          2px 2px 0 #000,
          0 3px 10px #000,
          0 0 24px #000;
        z-index: 1000;
      }

      option {
        font-size: 1.2rem;
      }
    </style>

    <script type="module">
      import init, { load_model, load_environment } from './pkg/web_viewer.js';

      await init();
      window.load_model = load_model;
      window.load_environment = load_environment;
    </script>
  </head>

  <body>
    <canvas id="canvas" width="1440" height="1440"></canvas>

    <select id="model-select">
      <option value="assets/models/khronos/DamagedHelmet.glb">Scifi Helmet</option>
      <option value="assets/models/khronos/PotOfCoals.glb">Pot of Coals</option>
      <option value="assets/models/khronos/WaterBottle.glb">Water Bottle</option>
      <option value="assets/models/khronos/Duck.glb">Duck</option>
      <option value="assets/models/polyhaven/brass_vase_03_2k.glb">Brass Vase</option>
      <option value="assets/models/polyhaven/portable_searchlight_2k.glb">Portable Searchlight</option>
      <option value="assets/models/polyhaven/Television_01_4k.glb">Television</option>
    </select>

    <select id="bg-select">
      <option value="assets/ibl/colorful_studio_4k.hdr">Colorful Studio</option>
      <option value="assets/ibl/venice_sunset_4k.hdr">Venice Sunset</option>
      <option value="assets/ibl/ferndale_studio_04_4k.hdr">Ferndale Studio</option>
      <option value="assets/ibl/photo_studio_loft_hall_2k.hdr">Photo Studio</option>
      <option value="assets/ibl/veranda_2k.hdr">Veranda</option>
    </select>

    <div id="message">⏳ Loading...</div>

    <script>
      const modelSelect = document.getElementById('model-select');
      const bgSelect = document.getElementById('bg-select');

      modelSelect.addEventListener('change', () => {
        window.load_model(modelSelect.value);
      });

      bgSelect.addEventListener('change', () => {
        window.load_environment(bgSelect.value);
      });
    </script>
  </body>
</html>
