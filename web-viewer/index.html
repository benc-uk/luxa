<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />

    <title>Luxa: WASM Demo</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #112;
      }

      canvas {
        display: block;
        background: #000;
        height: 100vh;
        margin: 0 auto;
      }

      select {
        font-size: 1.2rem;
        padding: 0.2rem 0.4rem;
        background: #222;
        color: #c5c5c5;
        border-radius: 0.4rem;
        padding: 0.4rem;
        position: absolute;
        top: 10px;
        left: 10px;
        z-index: 1000;
      }

      #loading {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 2rem;
        color: #fff;
        font-family: sans-serif;
      }

      option {
        font-size: 1.2rem;
      }
    </style>

    <script type="module">
      import init from "./pkg/web_viewer.js";
      init();
    </script>
  </head>

  <body>
    <canvas id="canvas" width="2560" height="1440"></canvas>
    <select id="model-select">
      <option value="DamagedHelmet.glb">Damaged Helmet</option>
      <option value="PotOfCoals.glb">Pot of Coals</option>
      <option value="WaterBottle.glb">Water Bottle</option>
      <option value="Duck.glb">Duck</option>
    </select>

    <div id="loading">⏳ Loading model...</div>

    <script>
      const select = document.getElementById("model-select");

      // Reflect the current URL hash (e.g. #water_bottle.glb) in the picker on load.
      const current = decodeURIComponent(location.hash.replace(/^#/, ""));
      if (current) select.value = current;

      // Set the hash to the chosen model and reload so the wasm picks it up at startup.
      select.addEventListener("change", () => {
        location.hash = select.value;
        location.reload();
      });
    </script>
  </body>
</html>
